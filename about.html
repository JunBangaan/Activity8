<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banga-an's Creatives</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #dce9e4;
            color: #020202;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #0b96e7;
            color: white;
            flex-shrink: 0;
        }
        .top-header {
            height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            border-bottom: 1px solid #71827e;
        }
        .logo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #b7d8c9;
            object-fit: cover;
        }
        .brand {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        nav {
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 23px 45px;
            font-size: 17px;
            font-weight: bold;
        }
        nav a:hover,
        nav a.active {
            background-color: #3e514c;
        }
        main {
            flex: 1;
            display: flex;
            padding: 3vh 7%;
        }
        .hero {
            background-color: #eef5f1;
            flex: 1;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2vh 40px;
        }
        .hero h1 {
            font-size: clamp(20px, 3.4vh, 34px);
            color: #000000;
            margin-bottom: 1vh;
            letter-spacing: 1px;
        }
        .hero h2 {
            font-size: clamp(13px, 2vh, 18px);
            font-weight: normal;
            font-style: italic;
            margin-bottom: 3vh;
            color: #070707;
        }
        .profiles {
            display: flex;
            gap: clamp(12px, 3vh, 28px);
            margin-bottom: 3vh;
        }
        .profiles img {
            width: clamp(60px, 14vh, 115px);
            height: clamp(60px, 14vh, 115px);
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #607d73;
        }
        .description {
            max-width: 750px;
            font-size: clamp(12px, 2vh, 18px);
            line-height: 1.6;
            margin-bottom: 3vh;
        }
        footer {
            background-color: #283936;
            color: white;
            text-align: center;
            padding: 22px;
            font-size: 14px;
            flex-shrink: 0;
        }
        @media (max-width: 700px) {
            .brand {
                font-size: 20px;
            }
            nav a {
                padding: 20px 12px;
                font-size: 13px;
            }
            .hero {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="top-header">
            <!-- Replace logo.jpg with your logo -->
            <img src="logo.png" class="logo" alt="Logo">
            <div class="brand">
                Banga-an's CREATIVES
            </div>
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html" class="active">ABOUT</a>
            <a href="gallery.html">GALLERY</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>EXPERIENCE THE CREATIVE</h1>
            <h2>
                Crafting beauty through intentional design.
            </h2>
            <div class="profiles">
            </div>
            <p class="description">
                My name is Jun B. Banga-an and I'm learning how to code in VS code.
                </p>
                Currently studying at the Uninversity of Baguio.
                </p>
                Born on February 8, 2008
            </p>
        </section>
    </main>
    <footer>
        © 2026 Banga-an's Creatives
    </footer>
</body>
</html>
